name: Temporary Mapping Diagnostic

on:
  pull_request:
    branches:
      - main
      - 'v[0-9]*.[0-9][0-9]'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Materialize mapped Minecraft classes
        run: ./gradlew compileJava || true
      - name: Inspect Minecraft class and interface signatures
        run: |
          for jar in $(find ~/.gradle/caches/fabric-loom/26.3 -type f -name '*.jar'); do
            if [[ "$jar" == *minecraft-merged.jar || "$jar" == *minecraft-client.jar || "$jar" == *modern-yarn* ]]; then
              echo "=== $jar"
              jar tf "$jar" | grep -Ei '(^|/)(Axe|Hoe|Tool|Strip|Till|Fertil|Bonemeal).*\.class$' || true
            fi
          done
          mapped=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -type f -name '*modern-yarn*.jar' | head -n 1)
          echo "=== Fertilizable signatures from $mapped"
          javap -p -classpath "$mapped" net.minecraft.block.Fertilizable
          echo "=== SpawnEntry signatures"
          javap -p -classpath "$mapped" 'net.minecraft.world.biome.SpawnSettings$SpawnEntry'

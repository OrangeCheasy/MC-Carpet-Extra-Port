name: Temporary Mapping Diagnostic

on:
  pull_request:
    branches:
      - main
      - 'v[0-9]*.[0-9][0-9]'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Materialize mapped Minecraft classes
        run: ./gradlew compileJava || true
      - name: Inspect target source API
        run: |
          raw="$HOME/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar"
          named=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -type f -name '*.jar' ! -path '*-intermediary/*' ! -name 'mappings.jar' | grep 'minecraft-merged' | head -n 1)
          echo "Mapped source jar: $named"
          echo "=== Mapped Fertilizable interface"
          javap -p -classpath "$named" net.minecraft.block.Fertilizable
          echo "=== Official Item methods related to tools/blocks"
          javap -p -classpath "$raw" net.minecraft.world.item.Item | grep -Ei 'axe|hoe|strip|till|tool|useOn|block' || true
          echo "=== Official Tool component API"
          javap -p -classpath "$raw" net.minecraft.world.item.component.Tool
          echo "=== Official Tool class names"
          jar tf "$raw" | grep -Ei 'net/minecraft/world/item/.*(Axe|Hoe|Tool|Strip|Till).*\.class$' || true

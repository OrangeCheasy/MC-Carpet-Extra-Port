name: Temporary Mapping Diagnostic

on:
  pull_request:
    branches:
      - main
      - 'v[0-9]*.[0-9][0-9]'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Materialize mapped Minecraft classes
        run: ./gradlew compileJava || true
      - name: List relevant mapped class names
        run: |
          for jar in $(find ~/.gradle/caches/fabric-loom -type f -name '*.jar'); do
            matches=$(jar tf "$jar" 2>/dev/null | grep -E '(AxeItem|HoeItem|BonemealSource|Fertilizable|SpawnEntry|ConstantIntProvider).*\.class$' || true)
            if [ -n "$matches" ]; then
              echo "=== $jar"
              echo "$matches"
            fi
          done

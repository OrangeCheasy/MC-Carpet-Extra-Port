name: Temporary Mapping Migration

on:
  pull_request:
    branches:
      - main
      - 'v[0-9]*.[0-9][0-9]'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Migrate source to Mojang mappings
        run: ./gradlew migrateMappings --mappings "net.minecraft:mappings:26.3"
      - uses: actions/upload-artifact@v7
        with:
          name: migrated-source-minecraft-26.3
          path: remappedSrc

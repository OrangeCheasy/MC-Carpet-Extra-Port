name: Temporary 26.3 Block Transformer API Inspection

on:
  pull_request:
    branches:
      - main
      - 'v[0-9]*.[0-9][0-9]'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Materialize mapped Minecraft classes
        run: ./gradlew compileJava
      - name: Inspect block transformer null-player hook
        run: |
          named=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -type f -name '*.jar' ! -path '*-intermediary/*' ! -name 'mappings.jar' | grep 'minecraft-merged' | head -n 1)
          javap -p -s -classpath "$named" net.minecraft.component.type.BlockTransformerComponent

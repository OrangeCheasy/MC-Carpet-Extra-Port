name: Temporary 26.3 Game Test API Inspection

on:
  pull_request:
    branches:
      - main
      - 'v[0-9]*.[0-9][0-9]'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Materialize target Minecraft classes
        run: ./gradlew compileJava compileGametestJava || true
      - name: Inspect changed APIs
        run: |
          named=$(find "$HOME/.gradle/caches/fabric-loom/minecraftMaven" -type f -name '*.jar' ! -path '*-intermediary/*' ! -name 'mappings.jar' | grep 'minecraft-merged' | head -n 1)
          echo "Mapped source jar: $named"
          javap -p -s -classpath "$named" net.minecraft.test.TestData
          javap -p -s -classpath "$named" net.minecraft.test.FunctionTestInstance
          javap -p -s -classpath "$named" net.minecraft.block.RedstoneWireBlock | grep -Ei 'connect|redstone|wire' || true
